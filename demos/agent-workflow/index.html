<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多 Agent 分工与人工门 · 机制演示</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#202d2b;font:16px 'Microsoft YaHei',sans-serif}header{height:82px;background:#203d37;color:#fff;padding:19px 34px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}small{font-size:13px}.badge{padding:9px 14px;border:1px solid #b8c9bd;border-radius:4px;color:#f4e7c3}main{padding:25px 34px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px}h1{font-size:29px;margin:0 0 7px}p{line-height:1.7;margin:0;color:#53615b}.layout{display:grid;grid-template-columns:285px 1fr;gap:22px}aside,article{background:#faf9f5;border:1px solid #d3d5ca;border-radius:5px}aside{padding:22px}label{display:block;font-weight:bold;margin-bottom:12px}textarea{width:100%;height:105px;resize:none;background:#fff;border:1px solid #b7c1b6;border-radius:4px;padding:12px;font:16px 'Microsoft YaHei';line-height:1.6}button{font:15px 'Microsoft YaHei';min-height:44px;border:0;border-radius:4px;padding:10px 17px;background:#285e4b;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid #c28a37;outline-offset:3px}#start{width:100%;margin:12px 0 18px}aside p{font-size:13px}.rule{border-top:1px solid #d3d5ca;margin-top:20px;padding-top:16px}.rule b{display:block;margin-bottom:7px;font-size:14px}article{padding:24px;min-height:426px}.steps{display:flex;gap:8px;border-bottom:1px solid #d3d5ca;padding-bottom:18px;margin-bottom:21px}.step{flex:1;font-size:14px;color:#69756f;padding:8px 9px;background:#edeFE8}.step.active{background:#285e4b;color:#fff}h2{font-size:23px;margin:0 0 10px}.kicker{font:12px Consolas,monospace;color:#53665c;margin-bottom:9px;letter-spacing:2px}.rows{margin-top:17px}.row{display:grid;grid-template-columns:76px 1fr;gap:17px;padding:13px 0;border-top:1px solid #e0e1d8;line-height:1.6}.row b{color:#285e4b}.row span{font-size:15px}.actions{display:flex;align-items:center;gap:15px;margin-top:20px}.muted{font-size:13px;color:#66716a}.warn{background:#f3e9d6;padding:13px 17px;margin-top:15px;color:#745522;font-size:15px;line-height:1.6}footer{margin:21px 34px;display:flex;justify-content:space-between;color:#5a665e;font-size:12px}.check{display:flex;align-items:center;gap:9px;font-weight:normal;font-size:15px;margin-top:17px}.check input{width:19px;height:19px}.error{color:#a0412b;font-size:13px;min-height:19px}#reset{background:none;color:#285e4b;border:1px solid #9aa99c;padding:6px 12px;min-height:35px}@media(min-width:851px){header{height:72px}main{padding:18px 34px 0}.intro{margin-bottom:16px}h1{font-size:27px}aside{padding:17px 20px}textarea{height:88px}#start{margin:8px 0 12px}.rule{margin-top:13px;padding-top:11px}article{padding:21px}footer{margin:16px 34px}.row{padding:10px 0}}@media(max-width:850px){.layout{grid-template-columns:1fr}header{height:auto;gap:20px}.intro{display:block}footer{display:block}article{min-height:400px}}</style><header><div><strong>协作不是自动放行</strong><br><small>多 Agent 分工与人工门 / 交互原型</small></div><div class="badge">机制示意 · 虚构任务 · 无模型调用</div></header><main><div class="intro"><div><h1>从工作包，到可审核的候选</h1><p>明确谁负责、交付什么，以及必须在哪里停下来。</p></div><button id="reset">重置演示</button></div><div class="layout"><aside><label for="task">01 / 输入演示任务</label><textarea id="task" placeholder="例如：为虚构活动准备30秒预告片方案"></textarea><div id="error" class="error"></div><button id="start">拆分工作包</button><p>仅在本地处理输入。请勿填写客户、账户或任何私密信息。</p><div class="rule"><b>本演示的硬边界</b><p>不发群消息 · 不调用 AI<br>不上传 · 不发布 · 不自动委托</p></div><div class="rule"><b>设计方法，不是平台复刻</b><p>不代表 Hermes / Ekko 原生界面；不证明群聊端到端投递。</p></div></aside><article><nav class="steps"><div class="step active">1 任务入口</div><div class="step">2 角色分工</div><div class="step">3 候选交付</div><div class="step">4 人工审核</div></nav><section id="view"></section></article></div></main><footer><span>来源方法：角色合同 / 独立复核 / 发布前人工门（已脱敏概括）</span><span>所有角色内容均为预设示例，非 Agent 真实回复</span></footer><script>let stage=0;const view=document.querySelector('#view');const task=document.querySelector('#task');function setStage(n){stage=n;document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i===n));render()}function button(id,text){return `<div class="actions"><button id="${id}">${text}</button><span class="muted">人工点击推进，不自动接力</span></div>`}function render(){if(stage===0)view.innerHTML='<div class="kicker">WORK PACKAGE / LOCAL DEMO</div><h2>先约定责任，再进入执行</h2><p>输入一个虚构任务，查看统筹、执行与复核的责任分界。</p><div class="rows"><div class="row"><b>工作包</b><span>目标、候选产物、验收要求与停止点。</span></div><div class="row"><b>交接原则</b><span>执行只产候选；复核独立判断；返修由统筹发起。</span></div><div class="row"><b>人工门</b><span>发布、上传与正式写入，不因“已完成”而自动放行。</span></div></div>';if(stage===1){view.innerHTML='<div class="kicker">ROLE CONTRACT / 示例分工</div><h2 id="brief"></h2><div class="rows"><div class="row"><b>统筹</b><span>定义工作包：30 秒预告片候选脚本，列明缺失资料与停止点。</span></div><div class="row"><b>执行</b><span>只提交结构草案与待补资料，不生成效果承诺，不触发发布。</span></div><div class="row"><b>复核</b><span>独立核对品牌规范、素材授权、效果证据与平台规则。</span></div></div>'+button('candidate','查看候选交付');document.querySelector('#brief').textContent=task.value;document.querySelector('#candidate').onclick=()=>setStage(2)}if(stage===2){view.innerHTML='<div class="kicker">CANDIDATE / 预设草案，非模型生成</div><h2>交付的是候选，不是发布许可</h2><div class="rows"><div class="row"><b>开场</b><span>提出虚构活动的主题；不使用真实客户与品牌素材。</span></div><div class="row"><b>主体</b><span>活动介绍 → 参与方式 → 结尾提示。具体文案待确认。</span></div><div class="row"><b>待补资料</b><span>品牌规范、素材授权、效果证据、平台规则。</span></div></div><div class="warn">停止点：资料未齐，不可将候选转为公开发布成品。</div>'+button('review','进入独立复核');document.querySelector('#review').onclick=()=>setStage(3)}if(stage===3){view.innerHTML='<div class="kicker">HUMAN GATE / 示例拒放</div><h2>复核结论：退回补证，停止外发</h2><p>品牌规范、素材授权与效果依据尚未补齐。<br>复核不自审自批、不直接指派执行；返修由统筹发起。</p><div class="warn">发布 / 上传 / 正式写入均未执行。<br>此页面只模拟审核动作，不授予真实系统权限。</div><label class="check"><input id="ack" type="checkbox">我已确认：记录退回，不代表发布批准</label><div class="actions"><button id="return" disabled>记录退回（本地示意）</button><span id="result" class="muted">等待人工确认</span></div>';document.querySelector('#ack').onchange=e=>document.querySelector('#return').disabled=!e.target.checked;document.querySelector('#return').onclick=()=>{document.querySelector('#result').textContent='已记录示例退回 · 无外部动作';document.querySelector('#return').disabled=true}}}document.querySelector('#start').onclick=()=>{if(!task.value.trim()){document.querySelector('#error').textContent='请先输入虚构任务';return}document.querySelector('#error').textContent='';setStage(1)};document.querySelector('#reset').onclick=()=>{task.value='';document.querySelector('#error').textContent='';setStage(0)};render();</script></html>
